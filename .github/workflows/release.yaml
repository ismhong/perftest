name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libibumad-dev \
            libpci-dev

      - name: Run autogen.sh
        run: ./autogen.sh

      - name: Configure the build
        run: ./configure

      - name: Build perftest
        run: make -j$(nproc)

      - name: Collect binaries
        run: |
          mkdir -p dist
          for bin in ib_send_bw ib_send_lat ib_write_bw ib_write_lat \
                     ib_read_bw ib_read_lat ib_atomic_bw ib_atomic_lat \
                     raw_ethernet_bw raw_ethernet_lat \
                     raw_ethernet_burst_lat raw_ethernet_fs_rate; do
            [ -f "$bin" ] && cp "$bin" dist/
          done
          cp run_perftest_loopback run_perftest_multi_devices dist/ 2>/dev/null || true

      - name: Create tarball
        run: |
          TAG="${{ github.ref_name }}"
          TARBALL="perftest-${TAG}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "${TARBALL}" -C dist .
          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perftest-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: perftest ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
